apiVersion: apps/v1
kind: Deployment
metadata:
  name:  movie-app
  namespace: dev
spec:
  replicas: 3
  selector:
   matchLabels:
    app: movie-app
  template:
    metadata:
      labels:
        app: movie-app 
    spec:
      containers:
      - name: movie-app-container
        image: priyanshumishracs/multibranch-flask-app:build-5
        ports:
        - containerPort: 5000